services:
  pro-zai:
    build:
      context: .
      dockerfile: Dockerfile
    image: pro-zai:latest
    container_name: pro-zai
    restart: unless-stopped
    init: true
    ports:
      - "8009:8765"
    env_file:
      - .env
    environment:
      PRO_ZAI_DATA_DIR: /app/data
      PRO_ZAI_LOG_DIR: /app/data/logs
    volumes:
      - ./data:/app/data
    shm_size: "1gb"
    mem_limit: "6g"
    cpus: "7.0"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
